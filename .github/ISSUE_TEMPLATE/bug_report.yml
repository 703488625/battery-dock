name: Bug report / 问题反馈
description: Report a crash, wrong battery reading, missing device, or UI issue.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please remove device serial numbers, Bluetooth addresses, and personal paths from logs before posting.
        请先删除日志中的序列号、蓝牙地址和个人路径。

  - type: input
    id: version
    attributes:
      label: BatteryDock version
      description: Release tag or the SHA-256 of BatteryDock.exe.
      placeholder: v1.0.0 / d8b113...
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 10.0.26200 / x64
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device model and VID/PID
      description: e.g. Logitech G PRO X SUPERLIGHT, receiver 046D:C547.
      placeholder: Model / VID:PID
    validations:
      required: true

  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Bluetooth
        - 2.4G receiver
        - USB wired
        - Not sure
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant app.log lines
      description: Run with --verbose and paste only the relevant section.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed serial numbers, Bluetooth addresses, and personal paths.
          required: true
        - label: I tested with the latest release.
          required: false
        - label: I closed vendor software that may lock the HID interface (G HUB, Razer Synapse, ATK HUB).
          required: false
